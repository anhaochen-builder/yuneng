version: '3.8'

services:
  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_REASONER_MODEL=${DEEPSEEK_REASONER_MODEL:-deepseek-reasoner}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DIAGNOSIS_MODE=${DIAGNOSIS_MODE:-ensemble}
      - OFFLINE_MODE=${OFFLINE_MODE:-auto}
      - QWEN_LOCAL_PATH=${QWEN_LOCAL_PATH:-}
      - VECTOR_DB_PATH=/app/knowledge_db
      - KNOWLEDGE_PATH=/app/data
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./knowledge_db:/app/knowledge_db
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
